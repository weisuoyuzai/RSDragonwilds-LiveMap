name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Offline tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: python -m pip install lupa

      - name: Run tests
        run: python tests/run_tests.py
        env:
          PYTHONIOENCODING: utf-8

  build-tools:
    name: Build WorldExtract
    runs-on: windows-latest
    steps:
      # CUE4Parse contains very long test-fixture paths
      - name: Enable long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build tools/WorldExtract/WorldExtract.csproj -c Release
