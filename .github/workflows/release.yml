name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the zip (manual runs only upload an artifact, no release)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: |
          python -m pip install lupa
          python tests/run_tests.py
        env:
          PYTHONIOENCODING: utf-8

      # Self-contained single file: players do not need the .NET runtime
      - name: Publish WorldExtract
        run: >
          dotnet publish tools/WorldExtract/WorldExtract.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o build/tools

      - name: Build package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '${{ github.event.inputs.version }}' }
          if (-not $version) { $version = 'dev' }
          python scripts/build_package.py --version $version --tools-dir build/tools
        env:
          PYTHONIOENCODING: utf-8

      - uses: actions/upload-artifact@v7
        with:
          name: LiveMap-package
          path: dist/*.zip

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
